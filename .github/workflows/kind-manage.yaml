name: Manage Kind Cluster (Stop / Start / Destroy)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Cluster Action'
        required: true
        default: 'stop'
        type: choice
        options:
          - stop
          - start
          - destroy

jobs:
  manage-cluster:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: ./kind

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Execute Cluster Action
        run: |
          CLUSTER_NAME="devops-cluster"
          SELECTED_ACTION="${{ github.event.inputs.action }}"
          
          echo "Executing action: $SELECTED_ACTION"

          if [ "$SELECTED_ACTION" == "stop" ]; then
            echo "Stopping Kind Docker containers..."
            docker stop $(docker ps -a --filter "name=${CLUSTER_NAME}" -q) || echo "No running containers found."

          elif [ "$SELECTED_ACTION" == "start" ]; then
            echo "Starting Kind Docker containers..."
            docker start $(docker ps -a --filter "name=${CLUSTER_NAME}" -q) || echo "No containers found to start."

          elif [ "$SELECTED_ACTION" == "destroy" ]; then
            echo "Extracting cluster name dynamically from Terraform state..."
            CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "devops-cluster")
            echo "Deleting Kind cluster: $CLUSTER_NAME"
            kind delete cluster --name "$CLUSTER_NAME"